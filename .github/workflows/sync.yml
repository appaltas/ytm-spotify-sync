name: Sync YouTube Music to Spotify

on:
  schedule:
    # Runs every 3 hours at minute 0 (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      check_auth_only:
        description: 'Solo verificar credenciales (no sincroniza nada)'
        type: boolean
        default: false
      dry_run:
        description: 'Simulacro: busca en Spotify pero no añade ni guarda estado'
        type: boolean
        default: false

concurrency:
  group: sync-ytm-spotify
  cancel-in-progress: false

jobs:
  sync:
    name: Execute Liked Songs Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Required to commit and push updated synced_tracks.json
      issues: write   # Required to open/close the "credentials expired" issue

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Offline Tests
        run: python test_sync.py

      # The sync never fails the step directly: its exit code is captured so the
      # state file can still be committed and a credentials issue can be opened
      # before the job is marked as failed at the very end.
      - name: Run Sync Script
        id: sync
        env:
          # OAuth (recommended - does not expire on its own)
          YTM_OAUTH_CLIENT_ID: ${{ secrets.YTM_OAUTH_CLIENT_ID }}
          YTM_OAUTH_CLIENT_SECRET: ${{ secrets.YTM_OAUTH_CLIENT_SECRET }}
          YTM_OAUTH_REFRESH_TOKEN: ${{ secrets.YTM_OAUTH_REFRESH_TOKEN }}
          # Legacy browser cookies (deprecated fallback, expires often)
          YTM_HEADERS_JSON: ${{ secrets.YTM_HEADERS_JSON }}
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
          CHECK_AUTH_ONLY: ${{ inputs.check_auth_only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          FLAGS=""
          if [ "$CHECK_AUTH_ONLY" = "true" ]; then FLAGS="$FLAGS --check-auth"; fi
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi

          set +e
          python main.py $FLAGS
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Sync finished with exit code $code."

      - name: Commit and Push State Updates
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(sync): update synced_tracks.json state [skip ci]"
          file_pattern: 'synced_tracks.json'

      # Exit codes: 2 = YouTube Music auth, 3 = Spotify auth, 4 = missing config.
      - name: Open Credentials Issue
        if: contains(fromJSON('["2","3","4"]'), steps.sync.outputs.exit_code)
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.sync.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const code = process.env.EXIT_CODE;
            const runUrl = process.env.RUN_URL;
            const label = 'credenciales-caducadas';

            const details = {
              '2': {
                title: '🔐 La sesión de YouTube Music ha caducado',
                body: [
                  'La sincronización no puede leer tus canciones con "Me gusta": YouTube Music responde como si no hubiera sesión iniciada.',
                  '',
                  '**Cómo arreglarlo (5 minutos, una sola vez):**',
                  '1. En tu ordenador: `python setup_ytm_oauth.py`',
                  '2. Copia los tres valores que imprime y actualiza los secretos `YTM_OAUTH_CLIENT_ID`, `YTM_OAUTH_CLIENT_SECRET` y `YTM_OAUTH_REFRESH_TOKEN`.',
                  '3. Lanza el workflow a mano con la opción *Solo verificar credenciales* para comprobarlo.',
                  '',
                  'Si sigues usando cookies (`YTM_HEADERS_JSON`), migra a OAuth: las cookies caducan cada pocas semanas al usarse desde GitHub Actions.',
                ].join('\n'),
              },
              '3': {
                title: '🔐 El refresh token de Spotify ha sido rechazado',
                body: [
                  'Spotify ha rechazado las credenciales guardadas en los secretos del repositorio.',
                  '',
                  '**Cómo arreglarlo:**',
                  '1. En tu ordenador: `python get_spotify_token.py`',
                  '2. Actualiza el secreto `SPOTIPY_REFRESH_TOKEN` con el valor que imprime.',
                ].join('\n'),
              },
              '4': {
                title: '⚙️ Falta configuración en los secretos del repositorio',
                body: [
                  'Falta al menos un secreto obligatorio. Revisa el log del run para ver cuál.',
                  '',
                  'Secretos necesarios: `YTM_OAUTH_CLIENT_ID`, `YTM_OAUTH_CLIENT_SECRET`, `YTM_OAUTH_REFRESH_TOKEN`, `SPOTIPY_CLIENT_ID`, `SPOTIPY_CLIENT_SECRET`, `SPOTIPY_REFRESH_TOKEN`, `SPOTIFY_PLAYLIST_ID`.',
                ].join('\n'),
              },
            }[code];

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (open.data.some(issue => issue.title === details.title)) {
              core.info('An open issue already reports this problem; not creating a duplicate.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: details.title,
              labels: [label],
              body: `${details.body}\n\n---\nRun que ha fallado: ${runUrl}\n\n_Este issue se cerrará solo en cuanto una sincronización vuelva a funcionar._`,
            });

      - name: Close Credentials Issue After Recovery
        if: steps.sync.outputs.exit_code == '0'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const label = 'credenciales-caducadas';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Resuelto: la sincronización ha vuelto a completarse correctamente.\n${process.env.RUN_URL}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Fail Job If Sync Failed
        if: steps.sync.outputs.exit_code != '0'
        run: |
          echo "::error::La sincronización terminó con código ${{ steps.sync.outputs.exit_code }}. Revisa el log anterior."
          exit 1

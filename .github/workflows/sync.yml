name: Sync YouTube Music to Spotify

on:
  schedule:
    # Runs every 3 hours at minute 0 (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: sync-ytm-spotify
  cancel-in-progress: false

jobs:
  sync:
    name: Execute Liked Songs Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push updated synced_tracks.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sync Script
        env:
          YTM_HEADERS_JSON: ${{ secrets.YTM_HEADERS_JSON }}
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
        run: |
          python main.py

      - name: Commit and Push State Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage state file only
          git add synced_tracks.json
          
          # Check if changes exist in synced_tracks.json
          if git diff --staged --quiet; then
            echo "No state changes detected. Nothing to commit."
          else
            echo "Changes detected in synced_tracks.json. Committing and pushing..."
            git commit -m "chore(sync): update synced_tracks.json state [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
